{% extends "base.html" %}
{% block content %}
<div class="auth-wrap">
  <div class="auth-card">
    <div class="brand-big">📄</div>
    <h2>Welcome Back!</h2>
    <p class="muted">Login to analyze your resume</p>
    <form method="post">
      <label>Email</label>
      <input class="form-control mb-3" type="email" name="email" required placeholder="Enter your email">
      <label>Password</label>
      <input class="form-control mb-3" type="password" name="password" required placeholder="Enter your password">
      <button class="btn btn-primary w-100">Login</button>
    </form>
    <p class="mt-3 text-center">Don't have an account? <a href="{{ url_for('signup') }}">Sign up</a></p>
  </div>
</div>
{% endblock %}
