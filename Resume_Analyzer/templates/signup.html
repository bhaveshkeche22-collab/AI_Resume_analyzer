{% extends "base.html" %}
{% block content %}
<div class="auth-wrap">
  <div class="auth-card">
    <div class="brand-big">📄</div>
    <h2>Create Account</h2>
    <p class="muted">Start analyzing your resume</p>
    <form method="post">
      <label>Full Name</label>
      <input class="form-control mb-3" name="name" required placeholder="Enter your full name">
      <label>Email</label>
      <input class="form-control mb-3" type="email" name="email" required placeholder="Enter your email">
      <label>Password</label>
      <input class="form-control mb-3" type="password" name="password" required placeholder="Create password">
      <label>Confirm Password</label>
      <input class="form-control mb-3" type="password" name="confirm_password" required placeholder="Confirm password">
      <button class="btn btn-primary w-100">Sign Up</button>
    </form>
    <p class="mt-3 text-center">Already have an account? <a href="{{ url_for('login') }}">Login</a></p>
  </div>
</div>
{% endblock %}
